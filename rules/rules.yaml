# Bo luat QC khai bao bang cau hinh — them luat moi chi can them mot muc
# o day, khong sua code.
#
# Moi luat co nam phan:
#   id       — dinh danh, hien tren giao dien va trong bang qc_exception
#   severity — critical | warning | info. Chi de xep thu tu doc va de loc:
#              tu P6, vi pham KHONG khoa cong phat hanh nua (xem
#              docs/quy-trinh-chat-luong.md). Chi ticket moi chan duoc
#   scope    — (tuy chon) danh sach bang luat nay ap dung. Bo di = moi bang
#   message  — cau nguoi dung doc khi gap ngoai le nay
#   sql      — SELECT tra ve khoa tu nhien (year, state, gender, name) va
#              cot `observed` dang jsonb de nguoi dung thay so lieu goc
#
# Nguong duoc dat tu profile du lieu that, khong phai doan.
#
# Job se tu choi chay neu file nay sai cau truc — sai o dau bao o day,
# khong de den luc SQL no ra loi kho hieu.

# Doi `version` moi khi sua bo luat: so nay duoc ghi vao tung ban ky, de sau
# nay tai hien duoc team lead da duyet duoi bo luat nao.
version: 2

rules:
  # --- Toan ven du lieu: phai luon bang 0, khac 0 la sai o khau nap ---

  - id: thi_phan_khong_tron_100
    severity: critical
    message: "Tong thi phan cua nhom lech khoi 100%"
    sql: |
      SELECT NULL::int AS year, g.state, g.gender, NULL::text AS name,
             jsonb_build_object('nam', g.year, 'tong_thi_phan', round(g.tong::numeric, 6)) AS observed
      FROM (SELECT year, state, gender, sum(market_share) AS tong
            FROM fact_current GROUP BY year, state, gender) g
      WHERE abs(g.tong - 1.0) > 0.000001

  - id: duoi_nguong_kiem_duyet
    severity: critical
    message: "So tre duoi 5 — nguon SSA khong cong bo muc nay, du lieu dang ngo"
    # Vi du ve pham vi: bo dong `scope` di thi luat ap cho moi bang.
    # scope: [CA, TX]
    sql: |
      SELECT year, state, gender, name,
             jsonb_build_object('number', number) AS observed
      FROM fact_current
      WHERE number < 5

  # --- Bat thuong nghiep vu: co that trong du lieu ---

  - id: tang_dot_bien
    severity: critical
    message: "Tang hon 10 lan so voi nam truoc trong cung mot bang"
    sql: |
      SELECT year, state, gender, name,
             jsonb_build_object('number', number, 'prev_number', prev_number,
                                'gap_tang', round(number::numeric/prev_number, 1)) AS observed
      FROM fact_current
      WHERE prev_number > 0 AND number::numeric/prev_number > 10

  - id: ten_pho_bien_bien_mat
    severity: critical
    message: "Ten tung pho bien (>=50 tre) bien mat hon 3 nam roi quay lai"
    sql: |
      SELECT year, state, gender, name,
             jsonb_build_object('nam_truoc_co_du_lieu', prev_year,
                                'so_nam_dut', year - prev_year,
                                'prev_number', prev_number) AS observed
      FROM fact_current
      WHERE prev_year IS NOT NULL AND year - prev_year > 3 AND prev_number >= 50

  - id: bien_dong_bat_thuong
    severity: warning
    message: "Bien dong so voi nam truoc vuot 300%"
    sql: |
      SELECT year, state, gender, name,
             jsonb_build_object('number', number, 'prev_number', prev_number,
                                'thay_doi_pct', round((number::numeric/prev_number - 1)*100, 1)) AS observed
      FROM fact_current
      WHERE prev_number > 0 AND abs(number::numeric/prev_number - 1) > 3
        AND number::numeric/prev_number <= 10
