# !! Since P10 this is a SEED FILE, not the rule book that is running !!
#
# The live rule book lives in Postgres (table qc_rule, version in qc_ruleset)
# and is added / edited / disabled / deleted inside the app ("QC rule book"
# dialog, team_lead / admin). Migration p10 reads this file ONCE to seed
# qc_rule while that table is empty — editing this file changes NOTHING on a
# running system.
#
# To make this file match the current rule book (e.g. for a new environment):
# QC rule book dialog -> YAML tab -> Download YAML -> replace this file -> commit.
#
# The format below is unchanged, and is also the format the app exports.
#
# Rule format (before P10, adding a rule meant adding an entry here; now it
# is done in the app and this file only seeds a fresh database).
#
# Each rule consists of five parts:
#   id       — identifier; displayed in the UI and the qc_exception table
#   severity — critical | warning | info. Used for sorting and filtering:
#   message  — message displayed to the user when this exception occurs
#   sql      — SELECT statement returning the natural key (year, state, institution_id,
#              institution) and an `observed` column (jsonb) to show raw data
version: 6

rules:
  # --- Data integrity: must always equal 0; nonzero means an error occurred during ingestion ---

  - id: deposit_share_sum_not_100
    severity: critical
    message: "Total deposit share for the group deviates from 100%"
    sql: |
      SELECT g.year, g.state, NULL::int AS institution_id, NULL::text AS institution,
             jsonb_build_object('total_share', round(g.tong::numeric, 6)) AS observed
      FROM (SELECT year, state, sum(deposit_share) AS tong
            FROM fact_current GROUP BY year, state) g
      WHERE abs(g.tong - 1.0) > 0.000001

  # Unlike the rule above: that rule checks the GROUP total, this rule checks EACH
  # row — pinpointing exactly which row holds a deposit_share value that does NOT
  # match the formula, instead of only knowing the group as a whole deviates from
  # 1.0. Correct formula: deposit divided by the total deposit for the same
  # (year, state) — matches exactly the SAFE_DIVIDE formula in jobs/seed/main.py.
  - id: deposit_share_formula_mismatch
    severity: critical
    message: "This row's deposit_share does not match the formula deposit / total deposit for the state"
    sql: |
      SELECT year, state, institution_id, institution,
             jsonb_build_object('deposit_share', round(deposit_share::numeric, 8),
                                'expected', round(dung::numeric, 8),
                                'diff', round((deposit_share::numeric - dung), 8)) AS observed
      FROM (
        SELECT *, deposit::numeric / SUM(deposit::numeric) OVER (PARTITION BY year, state) AS dung
        FROM fact_current
      ) x
      WHERE abs(deposit_share::numeric - dung) > 0.000001

  - id: deposit_negative_or_zero
    severity: critical
    message: "Deposit is negative or zero — not valid for an active institution"
    # Example of scope: omit the `scope` line and the rule applies to every table.
    # scope: [CA, TX]
    sql: |
      SELECT year, state, institution_id, institution,
             jsonb_build_object('deposit', deposit) AS observed
      FROM fact_current
      WHERE deposit <= 0

  # --- Business anomalies: genuine irregularities in the data ---

  - id: deposit_spike
    severity: critical
    message: "Deposit increased more than 15x compared to the previous year for the same institution"
    sql: |
      SELECT year, state, institution_id, institution,
             jsonb_build_object('deposit', deposit, 'prev_deposit', prev_deposit,
                                'spike_ratio', round(deposit::numeric/prev_deposit, 1)) AS observed
      FROM fact_current
      WHERE prev_deposit > 0 AND deposit::numeric/prev_deposit > 15

  - id: institution_reappeared_after_gap
    severity: critical
    message: "A large institution (deposit >= 100M) disappeared for more than 3 years then reappeared"
    sql: |
      SELECT year, state, institution_id, institution,
             jsonb_build_object('prev_year_with_data', prev_year,
                                'gap_years', year - prev_year,
                                'prev_deposit', prev_deposit) AS observed
      FROM fact_current
      WHERE prev_year IS NOT NULL AND year - prev_year > 3 AND prev_deposit >= 100000

  - id: unusual_deposit_change
    severity: warning
    message: "Deposit changed by more than 300% compared to the previous year"
    sql: |
      SELECT year, state, institution_id, institution,
             jsonb_build_object('deposit', deposit, 'prev_deposit', prev_deposit,
                                'change_pct', round((deposit::numeric/prev_deposit - 1)*100, 1)) AS observed
      FROM fact_current
      WHERE prev_deposit > 0 AND abs(deposit::numeric/prev_deposit - 1) > 3
        AND deposit::numeric/prev_deposit <= 15
